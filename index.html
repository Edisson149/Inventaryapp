<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InventaryApp · Toma Física de Inventarios</title>
<meta name="description" content="Plataforma de toma física de inventarios: conteo ciego, 2do conteo, escáner, trazabilidad por SKU, Excel/PDF y Google Sheets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --p: #0F4C81;
    --pd: #0b3a63;
    --a: #E65100;
    --bg: #f1f5f9;
    --c: #fff;
    --t: #0f172a;
    --m: #64748b;
    --b: #e2e8f0;
    --ok: #059669;
    --er: #dc2626;
    --wa: #d97706;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    font: 14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background: var(--bg);
    color: var(--t);
  }

  h1 {
    font-size: 22px;
    margin: 0;
  }

  h2 {
    font-size: 16px;
    margin: 0;
  }

  h3 {
    font-size: 14px;
    margin: 0;
  }

  .mono {
    font-family: ui-monospace,Menlo,Consolas,monospace;
  }

  header.top {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--p);
    color: #fff;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
  }

  .brand {
    font-weight: 800;
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .brand small {
    font-weight: 500;
    opacity: .75;
    font-size: 11px;
    display: block;
    line-height: 1;
  }

  nav.tabs {
    display: flex;
    gap: 20px;
    flex: 1;
    overflow: auto;
  }

  nav.tabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: #cbd5e1;
    font: 600 13px inherit;
    padding: 18px 0 16px;
    cursor: pointer;
    white-space: nowrap;
  }

  nav.tabs button.on,
  nav.tabs button:hover {
    color: #fff;
    border-color: #fff;
  }

  .userchip {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }

  .userchip .who {
    text-align: right;
    line-height: 1.2;
  }

  .userchip .who b {
    display: block;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px 20px 90px;
  }

  .card {
    background: var(--c);
    border: 1px solid var(--b);
    border-radius: 14px;
    padding: 18px;
  }

  .grid {
    display: grid;
    gap: 14px;
  }

  .g2 {
    grid-template-columns: repeat(2,1fr);
  }

  .g3 {
    grid-template-columns: repeat(3,1fr);
  }

  .g4 {
    grid-template-columns: repeat(4,1fr);
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .sp {
    justify-content: space-between;
  }

  .col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .kpi .n {
    font-size: 28px;
    font-weight: 800;
    color: var(--p);
  }

  .kpi .l {
    color: var(--m);
    font-size: 12px;
    font-weight: 600;
  }

  .muted {
    color: var(--m);
  }

  .small {
    font-size: 12px;
  }

  .right {
    text-align: right;
  }

  .center {
    text-align: center;
  }

  .btn {
    border: 1px solid var(--b);
    background: #fff;
    color: var(--t);
    border-radius: 10px;
    padding: 8px 13px;
    font: 600 13px inherit;
    cursor: pointer;
    display: inline-flex;
    gap: 6px;
    align-items: center;
    min-height: 36px;
  }

  .btn:hover {
    background: #f8fafc;
  }

  .btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .btn.p {
    background: var(--p);
    color: #fff;
    border-color: var(--p);
  }

  .btn.p:hover {
    background: var(--pd);
  }

  .btn.a {
    background: var(--a);
    color: #fff;
    border-color: var(--a);
  }

  .btn.d {
    color: var(--er);
    border-color: #fecaca;
  }

  .btn.s {
    padding: 5px 9px;
    min-height: 30px;
    font-size: 12px;
  }

  .btn.ghost {
    background: rgba(255,255,255,.15);
    color: #fff;
    border-color: transparent;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 4px;
  }

  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 9px 11px;
    font: inherit;
    background: #fff;
    color: var(--t);
    min-height: 38px;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid rgba(15,76,129,.3);
    border-color: var(--p);
  }

  input[type=checkbox] {
    width: auto;
    min-height: 0;
  }

  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
  }

  .b-PENDIENTE {
    background: #fef3c7;
    color: #92400e;
  }

  .b-EN_CURSO {
    background: #dbeafe;
    color: #1e40af;
  }

  .b-FINALIZADO {
    background: #d1fae5;
    color: #065f46;
  }

  .b-ok {
    background: #d1fae5;
    color: #065f46;
  }

  .b-er {
    background: #fee2e2;
    color: #991b1b;
  }

  .b-wa {
    background: #fef3c7;
    color: #92400e;
  }

  .b-in {
    background: #e2e8f0;
    color: #334155;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--m);
    padding: 8px;
    border-bottom: 1px solid var(--b);
    white-space: nowrap;
  }

  td {
    padding: 8px;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
  }

  tr:hover td {
    background: #fafcff;
  }

  .tw {
    overflow: auto;
    max-height: 520px;
  }

  .bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar>i {
    display: block;
    height: 100%;
    background: var(--p);
  }

  .tabs2 {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tabs2 button {
    border: 1px solid var(--b);
    background: #fff;
    border-radius: 99px;
    padding: 5px 13px;
    font: 600 12px inherit;
    cursor: pointer;
  }

  .tabs2 button.on {
    background: var(--p);
    color: #fff;
    border-color: var(--p);
  }

  .item {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--b);
    border-radius: 12px;
    padding: 12px;
    background: #fff;
  }

  .item.done {
    border-color: #a7f3d0;
    background: #f0fdf9;
  }

  .item.diff {
    border-color: #fed7aa;
    background: #fff7ed;
  }

  .item .qty {
    font-size: 20px;
    font-weight: 800;
  }

  #modal .ov {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.55);
    z-index: 60;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 4vh 12px;
    overflow: auto;
  }

  #modal .box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 560px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }

  #modal .box.wide {
    max-width: 980px;
  }

  #toasts {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 360px;
  }

  .toast {
    background: #fff;
    border: 1px solid var(--b);
    border-left: 4px solid var(--p);
    border-radius: 10px;
    padding: 10px 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15);
  }

  .toast.success {
    border-left-color: var(--ok);
  }

  .toast.error {
    border-left-color: var(--er);
  }

  .toast.warning {
    border-left-color: var(--a);
  }

  .toast b {
    display: block;
    font-size: 13px;
  }

  .toast span {
    font-size: 12px;
    color: var(--m);
  }

  .login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login .box {
    width: 100%;
    max-width: 400px;
  }

  .login .hero {
    background: var(--p);
    color: #fff;
    border-radius: 16px 16px 0 0;
    padding: 24px;
  }

  .login form {
    background: #fff;
    border: 1px solid var(--b);
    border-top: 0;
    border-radius: 0 0 16px 16px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .err {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
  }

  .drop {
    border: 2px dashed #cbd5e1;
    border-radius: 14px;
    padding: 22px;
    text-align: center;
    position: relative;
    background: #f8fafc;
  }

  .drop.on {
    border-color: var(--p);
    background: #eff6ff;
  }

  .drop input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    min-height: 0;
  }

  pre.code {
    background: #0f172a;
    color: #e2e8f0;
    padding: 12px;
    border-radius: 10px;
    overflow: auto;
    max-height: 260px;
    font-size: 11px;
  }

  #qr-reader {
    width: 100%;
    min-height: 200px;
    background: #0f172a;
    border-radius: 12px;
    overflow: hidden;
  }

  .bottomnav {
    display: none;
  }

  @media(max-width:820px) {
    nav.tabs {
      display: none;
    }
    header.top {
      gap: 10px;
      padding: 0 12px;
    }
    .userchip .who {
      display: none;
    }
    .g2,
    .g3,
    .g4 {
      grid-template-columns: 1fr 1fr;
    }
    main {
      padding: 14px 12px 90px;
    }
    .bottomnav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--b);
      z-index: 40;
    }
    .bottomnav button {
      flex: 1;
      border: 0;
      background: none;
      padding: 10px 2px;
      font: 600 11px inherit;
      color: var(--m);
    }
    .bottomnav button.on {
      color: var(--p);
    }
  }

  @media(max-width:520px) {
    .g2,
    .g3,
    .g4 {
      grid-template-columns: 1fr;
    }
    .item {
      flex-direction: column;
      align-items: stretch;
    }
  }

  @media(max-width:820px) {
    #toasts {
      bottom: 78px;
      left: 12px;
      right: 12px;
      max-width: none;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
/* ===================== CONFIG / ESTADO ===================== */
var SEED = {
  company: {
    id: "1234567890",
    name: "EL REY DE LOS LICORES",
    nit: "900.000.000-1",
    sector: "Comercio de licores",
    sedePrincipal: "Sede Principal"
  },
  users: [],
  inventories: [],
  traceability: [],
  integration: {
    url: "https://script.google.com/macros/s/AKfycbyw7yfXBvMt5fqsTGq8gYROP5x5DduHuRUebzPV2MDRYRQe_KOp6G1zx9biIpIC2tqEIA/exec",
    auto: true,
    lastSyncAt: null,
    lastSyncStatus: "idle",
    lastSyncMessage: "",
    spreadsheetUrl: ""
  },
  audit: []
};

var MEM = {};
function stGet(w, k) {
  try {
    return window[w].getItem(k);
  } catch (e) {
    return MEM[w + k] !== undefined ? MEM[w + k] : null;
  }
}
function stSet(w, k, v) {
  try {
    window[w].setItem(k, v);
  } catch (e) {
    MEM[w + k] = v;
  }
}
function stDel(w, k) {
  try {
    window[w].removeItem(k);
  } catch (e) {
    delete MEM[w + k];
  }
}

var APP_VERSION = '4.1';
window.addEventListener('error', function (e) {
  try { toast('error', 'Error inesperado', e.message); } catch (x) {}
});
window.addEventListener('unhandledrejection', function (e) {
  try { toast('error', 'Error inesperado', (e.reason && e.reason.message) || String(e.reason)); } catch (x) {}
});

var KEY = 'stockpulse_v2_' + SEED.company.id;
var ROLES = {
  ADMIN: 'Administrador',
  SUPERVISOR: 'Supervisor / Auditor',
  OPERARIO: 'Operario / Contador',
  CONSULTOR: 'Consultor (solo lectura)'
};
var PERM = {
  createInv: ['ADMIN', 'SUPERVISOR'],
  count: ['ADMIN', 'SUPERVISOR', 'OPERARIO'],
  toggleTheo: ['ADMIN', 'SUPERVISOR'],
  recount: ['ADMIN', 'SUPERVISOR'],
  doRecount: ['ADMIN', 'SUPERVISOR', 'OPERARIO'],
  finalize: ['ADMIN', 'SUPERVISOR'],
  reports: ['ADMIN', 'SUPERVISOR', 'CONSULTOR'],
  users: ['ADMIN'],
  settings: ['ADMIN'],
  deleteInv: ['ADMIN']
};

var S = loadState();
var session = null;
var ui = {
  view: 'dashboard',
  invId: null,
  tab: 'ALL',
  q: '',
  cq: '',
  cf: 'all',
  stage: { rows: [], warnings: [], fileName: '' },
  tq: ''
};

function $(s, r) {
  return (r || document).querySelector(s);
}

function $$(s, r) {
  return Array.prototype.slice.call((r || document).querySelectorAll(s));
}
var HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return HTML_ESCAPES[c]; });
}
// Sanea texto: quita caracteres de control, < > y prefijos que Excel/Sheets interpretaría como fórmula (= + - @).
function clean(v) {
  return String(v == null ? '' : v)
    .replace(/[\u0000-\u001f\x7f<>]/g, '')
    .trim()
    .replace(/^[=+\-@\t\r\n]+/, '')
    .trim();
}
function pad(n) {
  return String(n).padStart(2, '0');
}

function pad3(n) {
  return String(n).padStart(3, '0');
}

function now() {
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function uid(p) {
  return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Nunca se guardan usuarios ni tokens en localStorage.
function stripSensitive(s) {
  s.users = [];
  if (s.integration) delete s.integration.token;
  return s;
}

function persistable(s) {
  var o = Object.assign({}, s);
  o.users = [];
  return o;
}

function loadState() {
  try {
    var j = JSON.parse(stGet('localStorage', KEY));
    if (j && j.inventories) { stripSensitive(j); stSet('localStorage', KEY, JSON.stringify(persistable(j))); return j; }
  } catch (e) {}
  var s = JSON.parse(JSON.stringify(SEED));
  s.audit = [];
  stripSensitive(s);
  stSet('localStorage', KEY, JSON.stringify(persistable(s)));
  return s;
}

var bc = null;
var syncTimer = null;
try { bc = new BroadcastChannel(KEY); } catch (e) {}

function save(opts) {
  opts = opts || {};
  stSet('localStorage', KEY, JSON.stringify(persistable(S)));
  if (bc) {
    try { bc.postMessage('upd'); } catch (e) {}
  }
  if (!opts.noSync && session && S.integration.auto && S.integration.url) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { syncNow(true); }, 2500);
  }
}

function audit(action, detail) {
  S.audit = S.audit || [];
  S.audit.unshift({ t: now(), u: session ? session.username : '-', a: action, d: detail || '' });
  S.audit.length = Math.min(S.audit.length, 300);
}

function vis() {
  return S.inventories.filter(function (i) { return !i.deleted; });
}

function byId(id) {
  return vis().find(function (i) { return i.idInventario === id; });
}

function can(a) {
  return !!session && PERM[a].indexOf(session.role) >= 0;
}

function need(a) {
  if (!can(a)) {
    throw new Error('Su rol (' + (session ? ROLES[session.role] : '-') + ') no tiene permiso para esta acción.');
  }
}

function showTheo(inv) {
  return !!inv.mostrarStockTeorico && session && session.role !== 'OPERARIO';
}
function finalQty(it) {
  return it.conteo2 != null ? it.conteo2 : (it.conteo1 != null ? it.conteo1 : 0);
}

function isCounted(it) {
  return it.conteo1 !== null && it.conteo1 !== '';
}

function accuracy(items) {
  var total = items.reduce(function (a, i) { return a + i.stockTeorico; }, 0);
  if (total === 0) {
    var matching = items.filter(function (i) { return finalQty(i) === i.stockTeorico; }).length;
    return items.length ? +(matching / items.length * 100).toFixed(2) : 100;
  }
  var counted = items.filter(isCounted);
  if (!counted.length) return 0;
  var base = counted.reduce(function (a, i) { return a + i.stockTeorico; }, 0);
  if (base === 0) return 100;
  var error = counted.reduce(function (a, i) { return a + Math.abs(finalQty(i) - i.stockTeorico); }, 0);
  return +Math.max(0, (1 - error / base) * 100).toFixed(2);
}

function touch(inv) {
  inv.updatedAt = now();
}

function fmtN(n) {
  return Number(n).toLocaleString('es-CO');
}

/* ===================== AUTENTICACIÓN Y SESIÓN ===================== */

var SK = KEY + '_s';
var SESSION_TTL_MS = 12 * 60 * 60 * 1000;
function saveSess() { stSet('sessionStorage', SK, JSON.stringify({ s: session, last: Date.now() })); }

async function serverLogin(user, pass) {
  if (!S.integration.url) throw new Error('Configure la URL del servidor (Google Apps Script).');
  var r = await gas('login', { username: String(user || '').trim(), password: pass || '' }, true);
  session = Object.assign({}, r.user, { token: r.token });
  if (r.users) S.users = r.users;
  saveSess();
  audit('login', '');
  save({ noSync: true });
  return session;
}

function restoreSession() {
  try {
    var j = JSON.parse(stGet('sessionStorage', SK));
    if (j && j.s && j.s.token && Date.now() - j.last < SESSION_TTL_MS) { session = j.s; return; }
  } catch (e) {}
  stDel('sessionStorage', SK);
}

async function refreshMe() {
  if (!session) return;
  try {
    var r = await gas('me');
    Object.assign(session, r.user);
    if (r.users) S.users = r.users;
    saveSess();
    save({ noSync: true });
  } catch (e) {}
}

function forceLogout(msg) {
  session = null;
  stDel('sessionStorage', SK);
  ui.view = 'dashboard';
  ui.loginErr = msg || '';
  try { closeModal(); } catch (e) {}
  render();
}

function logout() {
  if (session) audit('logout', '');
  save({ noSync: true });
  session = null;
  stDel('sessionStorage', SK);
  ui.view = 'dashboard';
  ui.loginErr = '';
  render();
}

function activity() {
  if (!session) return;
  try {
    var j = JSON.parse(stGet('sessionStorage', SK));
    j.last = Date.now();
    stSet('sessionStorage', SK, JSON.stringify(j));
  } catch (e) {}
}

/* ===================== LÓGICA DE NEGOCIO ===================== */

function nextInvId() {
  var y = new Date().getFullYear(), mx = 0;
  S.inventories.forEach(function (i) {
    var m = /^INV-(\d{4})-(\d+)$/.exec(i.idInventario);
    if (m && +m[1] === y) mx = Math.max(mx, +m[2]);
  });
  return 'INV-' + y + '-' + pad3(mx + 1);
}

function createInventory(d) {
  need('createInv');
  if (!d.rows.length) throw new Error('Debe incluir al menos un artículo.');
  var id = nextInvId(), n = 0;
  var inv = {
    idInventario: id, companyId: S.company.id, companyName: S.company.name,
    titulo: clean(d.titulo) || ('Toma Física ' + S.company.name),
    fechaRealizacion: now().slice(0, 10), fechaHoraInicio: null, fechaHoraFin: null, duracionMinutos: 0,
    responsable: clean(d.responsable) || session.name, auditor: clean(d.auditor) || session.name,
    estado: 'PENDIENTE', mostrarStockTeorico: !!d.mostrarStockTeorico, reconteoHabilitado: false,
    indicadorExactitud: 0, creadoPor: session.username, updatedAt: now(),
    items: d.rows.map(function (r) {
      return {
        idDetalle: 'det-' + id + '-' + (++n) + '-' + Math.random().toString(36).slice(2, 5),
        idInventario: id, sku: clean(r.sku) || ('SKU-' + n), barcode: clean(r.barcode),
        descripcion: clean(r.descripcion) || 'Artículo sin descripción',
        categoriaMarca: clean(r.categoriaMarca), ubicacion: clean(r.ubicacion),
        stockTeorico: Math.round(Number(r.stockTeorico) || 0), conteo1: null, conteo2: null,
        datetimeConteo1: null, datetimeConteo2: null, usuarioConteo1: null, usuarioConteo2: null,
        notas: '', requiereReconteo: false
      };
    })
  };
  S.inventories.unshift(inv);
  audit('crear_inventario', id + ' (' + inv.items.length + ' ítems)');
  save();
  return inv;
}

function startInventory(id) {
  need('count');
  var inv = byId(id);
  if (!inv) throw new Error('Inventario no encontrado.');
  if (inv.estado === 'FINALIZADO') throw new Error('El inventario ya fue finalizado.');
  if (inv.estado === 'PENDIENTE') {
    inv.estado = 'EN_CURSO';
    inv.fechaHoraInicio = now();
    touch(inv);
    audit('iniciar', id);
    save();
  }
  return inv;
}

function saveCount(id, itemId, qty, notes) {
  need('count');
  var inv = byId(id);
  if (!inv) throw new Error('Inventario no encontrado.');
  if (inv.estado === 'FINALIZADO') throw new Error('El inventario ya fue finalizado.');
  var it = inv.items.find(function (x) { return x.idDetalle === itemId; });
  if (!it) throw new Error('Artículo no encontrado.');
  qty = Number(qty);
  if (!isFinite(qty) || qty < 0 || Math.round(qty) !== qty) throw new Error('Ingrese una cantidad entera mayor o igual a 0.');

  var t = now();
  it.conteo1 = qty;
  it.datetimeConteo1 = t;
  it.usuarioConteo1 = session.name;
  if (notes != null) it.notas = clean(notes);

  if (inv.estado === 'PENDIENTE') {
    inv.estado = 'EN_CURSO';
    inv.fechaHoraInicio = t;
  }
  if (inv.reconteoHabilitado && it.conteo2 == null) {
    it.requiereReconteo = (it.conteo1 !== it.stockTeorico);
  }
  inv.indicadorExactitud = accuracy(inv.items);
  touch(inv);
  save();
  return it;
}

/* ===================== SINCRONIZACIÓN ===================== */

function itemTs(i) {
  return [i.datetimeConteo2, i.datetimeConteo1].filter(Boolean).sort().pop() || '';
}

function mergeInv(a, b) {
  var fin = a.estado === 'FINALIZADO' ? a : (b.estado === 'FINALIZADO' ? b : null);
  var head = fin || ((a.updatedAt || '') >= (b.updatedAt || '') ? a : b);
  var oth = head === a ? b : a;
  var m = new Map();
  oth.items.forEach(function (i) { m.set(i.idDetalle, i); });
  head.items.forEach(function (i) {
    var o = m.get(i.idDetalle);
    m.set(i.idDetalle, o && itemTs(o) > itemTs(i) && !fin ? o : i);
  });
  var r = Object.assign({}, head);
  r.items = Array.from(m.values());
  r.indicadorExactitud = accuracy(r.items);
  r.reconteoHabilitado = a.reconteoHabilitado || b.reconteoHabilitado;
  r.deleted = head.deleted;
  return r;
}

function mergeState(rm) {
  if (rm.company && rm.company.name) S.company = Object.assign({}, S.company, rm.company);
  var im = new Map(S.inventories.map(function (i) { return [i.idInventario, i]; }));
  (rm.inventories || []).forEach(function (r) {
    var l = im.get(r.idInventario);
    im.set(r.idInventario, l ? mergeInv(r, l) : r);
  });
  S.inventories = Array.from(im.values());
  var tm = new Map(S.traceability.map(function (t) { return [t.idTrazabilidad, t]; }));
  (rm.traceability || []).forEach(function (t) {
    if (!tm.has(t.idTrazabilidad)) tm.set(t.idTrazabilidad, t);
  });
  S.traceability = Array.from(tm.values()).filter(function (t) {
    var inv = S.inventories.find(function (i) { return i.idInventario === t.idInventario; });
    return inv && !inv.deleted;
  }).sort(function (a, b) { return a.fechaRegistro < b.fechaRegistro ? 1 : -1; });
}

async function gas(action, extra, noAuth) {
  var I = S.integration;
  if (!I.url) throw new Error('Configure primero la URL del servidor (Google Apps Script).');
  var body = Object.assign({ action: action }, extra || {});
  if (!noAuth && session) body.t = session.token;

  var tm, res, t;
  try {
    var urlWithBuster = I.url + (I.url.indexOf('?') >= 0 ? '&' : '?') + '_t=' + Date.now();
    var fp = fetch(urlWithBuster, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (x) {
      return x.text().then(function (tx) { return { r: x, t: tx }; });
    });

    var to = new Promise(function (_, rej) {
      tm = setTimeout(function () { rej(new Error('TIMEOUT')); }, 45000);
    });
    res = await Promise.race([fp, to]);
    t = res.t.trim();
  } catch (e) {
    clearTimeout(tm);
    if (e && e.message === 'TIMEOUT') throw new Error('El servidor tardó más de 45 s en responder.');
    throw new Error('No se pudo contactar con el servidor. Verifique la conexión.');
  }
  clearTimeout(tm);

  var j;
  try { j = JSON.parse(t); } catch (e) { throw new Error('Respuesta no válida del servidor.'); }
  if (j.ok === false) {
    if (j.code === 'AUTH' && session) forceLogout('Su sesión expiró. Inicie sesión nuevamente.');
    throw new Error(j.error || 'Error en el servidor');
  }
  return j;
}

var syncP = null, syncAgain = false;
function syncNow(silent) {
  if (syncP) {
    if (silent) {
      syncAgain = true;
      return syncP;
    }
    return syncP.then(function () { return syncNow(false); });
  }
  if (!S.integration.url || !session) return Promise.resolve();

  var done = function () {
    syncP = null;
    if (syncAgain) {
      syncAgain = false;
      return syncNow(true);
    }
  };
  syncP = syncCore(silent).then(done, done);
  return syncP;
}

async function syncCore(silent) {
  var I = S.integration;
  try {
    var res = await gas('sync', { state: { company: S.company, inventories: S.inventories, traceability: S.traceability } });
    mergeState(res.state);
    if (res.users) {
      S.users = res.users;
      var me = S.users.find(function (u) { return u.id === session.id; });
      if (!me || me.active === false) { save({ noSync: true }); forceLogout('Su usuario ya no tiene acceso.'); return; }
      if (me.role !== session.role) { session.role = me.role; saveSess(); }
    }
    I.lastSyncAt = now();
    I.lastSyncStatus = 'ok';
    I.lastSyncMessage = 'Sincronizado (' + vis().length + ' inventarios)';
    if (res.spreadsheetUrl) I.spreadsheetUrl = res.spreadsheetUrl;
    save({ noSync: true });
    if (!silent) toast('success', 'Sincronización completa', I.lastSyncMessage);
    refreshLive();
  } catch (e) {
    I.lastSyncAt = now();
    I.lastSyncStatus = 'error';
    I.lastSyncMessage = e.message;
    save({ noSync: true });
    if (!silent) toast('error', 'Falló la sincronización', e.message);
  }
}

// Sincronización en segundo plano cada 8 s (solo con la pestaña visible).
setInterval(function () {
  if (session && S.integration.auto && S.integration.url && !document.hidden) {
    syncNow(true);
  }
}, 8000);

/* ===================== VISTAS ===================== */

function countListHTML(inv) {
  var q = ui.cq.toLowerCase(), th = showTheo(inv), fin = inv.estado === 'FINALIZADO';

  // Un ítem con conteo registrado nunca aparece como 'Sin contar'.
  var L = inv.items.filter(function (i) {
    var isDone = isCounted(i);
    var matchQuery = !q || (i.sku + ' ' + i.barcode + ' ' + i.descripcion).toLowerCase().indexOf(q) >= 0;
    var matchFilter = (ui.cf === 'all') || (ui.cf === 'pending' && !isDone) || (ui.cf === 'counted' && isDone);
    return matchQuery && matchFilter;
  });

  if (!L.length) return '<div class="card muted center">Sin resultados en esta vista.</div>';

  return L.slice(0, 300).map(function (i) {
    var done = isCounted(i);
    var d = done && finalQty(i) !== i.stockTeorico;
    return '<div class="item ' + (done ? (th && d ? 'diff' : 'done') : '') + '">' +
      '<div style="min-width:0;flex:1"><b>' + esc(i.descripcion) + '</b>' +
      '<div class="small muted mono">' + esc(i.sku) + (i.barcode && i.barcode !== i.sku ? ' · ' + esc(i.barcode) : '') + '</div>' +
      '<div class="small muted">' + esc(i.ubicacion || '') + ' ' + esc(i.categoriaMarca || '') + '</div>' +
      (th ? '<div class="small">Teórico: <b>' + i.stockTeorico + '</b></div>' : '') +
      (i.notas ? '<div class="small muted">📝 ' + esc(i.notas) + '</div>' : '') + '</div>' +
      '<div class="right">' + (done ? '<div class="qty">' + i.conteo1 + '</div><div class="small muted">' + esc((i.datetimeConteo1 || '').slice(11, 16)) + '</div>' : '<span class="badge b-in">Sin contar</span>') + '</div>' +
      (!fin && can('count') ? '<button class="btn ' + (done ? '' : 'p') + '" data-act="countModal" data-item="' + esc(i.idDetalle) + '">' + (done ? 'Corregir' : 'Contar') + '</button>' : '') +
      '</div>';
  }).join('') + (L.length > 300 ? '<div class="muted small center">Mostrando 300 de ' + L.length + '. Use el buscador.</div>' : '');
}

function refreshLive() {
  if (!session || $('#modal').innerHTML) return;
  var a = document.activeElement;
  // Si el usuario está escribiendo, solo se refresca la lista de conteo para no perder el foco.
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) {
    if (ui.view === 'count' && $('#clist')) {
      var inv = byId(ui.invId);
      if (inv) $('#clist').innerHTML = countListHTML(inv);
    }
    return;
  }
  if (ui.view !== 'create') render();
}

/* ===================== UI: TOASTS, MODAL Y COMPONENTES ===================== */

function toast(type, title, desc) {
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<b>' + esc(title) + '</b>' + (desc ? '<span>' + esc(desc) + '</span>' : '');
  $('#toasts').appendChild(el);
  setTimeout(function () { el.remove(); }, 4500);
}

function openModal(html, wide) {
  $('#modal').innerHTML =
    '<div class="ov" data-act="ovClick"><div class="box' + (wide ? ' wide' : '') + '">' + html + '</div></div>';
}

function closeModal() {
  $('#modal').innerHTML = '';
}
var ESTADOS = { PENDIENTE: 'Pendiente', EN_CURSO: 'En curso', FINALIZADO: 'Finalizado' };

function badge(e) {
  return '<span class="badge b-' + e + '">' + (ESTADOS[e] || e) + '</span>';
}
function bar(p) {
  return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, p)) + '%"></i></div>';
}

function progress(inv) {
  var counted = inv.items.filter(isCounted).length;
  var total = inv.items.length;
  return { c: counted, t: total, p: total ? counted / total * 100 : 0 };
}

function vLogin(err) {
  return '<div class="login"><div class="box"><div class="hero"><div style="font-size:12px;opacity:.8;font-weight:700">STOCKPULSE · TOMA FÍSICA DE INVENTARIOS</div><h1 style="margin-top:6px">' + esc(S.company.name) + '</h1></div>' +
    '<form id="loginForm" autocomplete="on">' + (err ? '<div class="err">' + esc(err) + '</div>' : '') +
    '<div><label for="lu">Usuario o correo</label><input id="lu" name="username" required autofocus></div>' +
    '<div><label for="lp">Contraseña</label><input id="lp" name="password" type="password" required></div>' +
    '<button class="btn p" type="submit" style="justify-content:center">Iniciar sesión</button>' +
    '<details ' + (S.integration.url ? '' : 'open') + '><summary class="small muted">⚙ Servidor (Google Apps Script)</summary><input id="lsrv" value="' + esc(S.integration.url) + '"></details>' +
    '</form></div></div>';
}

function render() {
  var app = $('#app');
  if (!session) { app.innerHTML = vLogin(ui.loginErr); return; }
  app.innerHTML = '<header class="top"><div class="brand">📦 StockPulse</div></header><main id="main"><h1>Panel de Inventarios</h1></main>';
}

function refreshCountList() {
  var list = $('#clist');
  var inv = byId(ui.invId);
  if (list && inv) list.innerHTML = countListHTML(inv);
}

document.addEventListener('input', function (e) {
  if (e.target.id === 'cq') {
    ui.cq = e.target.value;
    refreshCountList();
  }
});

document.addEventListener('change', function (e) {
  if (e.target.id === 'cf') {
    ui.cf = e.target.value;
    refreshCountList();
  }
});

document.addEventListener('submit', async function (e) {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();

  var srv = $('#lsrv');
  if (srv && srv.value.trim()) {
    S.integration.url = srv.value.trim();
    save({ noSync: true });
  }

  var btn = $('button[type=submit]', e.target);
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Ingresando...';
  }

  try {
    await serverLogin($('#lu').value, $('#lp').value);
    ui.loginErr = '';
    render();
    syncNow(true);
  } catch (err) {
    ui.loginErr = err.message;
    render();
  }
});

restoreSession();
render();
if (session) {
  refreshMe().then(function () { syncNow(true); });
}
</script>
