<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockPulse · Toma Física de Inventarios</title>
<meta name="description" content="Plataforma de toma física de inventarios: conteo ciego, 2do conteo, escáner, trazabilidad por SKU, Excel/PDF y Google Sheets.">
<style>:root{--p:#0F4C81;--pd:#0b3a63;--a:#E65100;--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--ok:#059669;--er:#dc2626;--wa:#d97706}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}h3{font-size:14px;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
header.top{position:sticky;top:0;z-index:30;background:var(--p);color:#fff;height:56px;display:flex;align-items:center;gap:24px;padding:0 20px}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.brand small{font-weight:500;opacity:.75;font-size:11px;display:block;line-height:1}
nav.tabs{display:flex;gap:20px;flex:1;overflow:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#cbd5e1;font:600 13px inherit;padding:18px 0 16px;cursor:pointer;white-space:nowrap}
nav.tabs button.on,nav.tabs button:hover{color:#fff;border-color:#fff}
.userchip{display:flex;align-items:center;gap:8px;font-size:12px}
.userchip .who{text-align:right;line-height:1.2}.userchip .who b{display:block}
main{max-width:1200px;margin:0 auto;padding:22px 20px 90px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:10px}
.kpi .n{font-size:28px;font-weight:800;color:var(--p)}.kpi .l{color:var(--m);font-size:12px;font-weight:600}
.muted{color:var(--m)}.small{font-size:12px}.right{text-align:right}.center{text-align:center}
.btn{border:1px solid var(--b);background:#fff;color:var(--t);border-radius:10px;padding:8px 13px;font:600 13px inherit;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:36px}
.btn:hover{background:#f8fafc}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--p);color:#fff;border-color:var(--p)}.btn.p:hover{background:var(--pd)}
.btn.a{background:var(--a);color:#fff;border-color:var(--a)}.btn.d{color:var(--er);border-color:#fecaca}.btn.s{padding:5px 9px;min-height:30px;font-size:12px}
.btn.ghost{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--t);min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(15,76,129,.3);border-color:var(--p)}
input[type=checkbox]{width:auto;min-height:0}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.b-PENDIENTE{background:#fef3c7;color:#92400e}.b-EN_CURSO{background:#dbeafe;color:#1e40af}.b-FINALIZADO{background:#d1fae5;color:#065f46}
.b-ok{background:#d1fae5;color:#065f46}.b-er{background:#fee2e2;color:#991b1b}.b-wa{background:#fef3c7;color:#92400e}.b-in{background:#e2e8f0;color:#334155}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--m);padding:8px;border-bottom:1px solid var(--b);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}tr:hover td{background:#fafcff}
.tw{overflow:auto;max-height:520px}
.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--p)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}.tabs2 button{border:1px solid var(--b);background:#fff;border-radius:99px;padding:5px 13px;font:600 12px inherit;cursor:pointer}.tabs2 button.on{background:var(--p);color:#fff;border-color:var(--p)}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--b);border-radius:12px;padding:12px;background:#fff}
.item.done{border-color:#a7f3d0;background:#f0fdf9}.item.diff{border-color:#fed7aa;background:#fff7ed}
.item .qty{font-size:20px;font-weight:800}
#modal .ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal .box{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal .box.wide{max-width:980px}
.correction-counts table{table-layout:fixed}
.correction-counts th,.correction-counts td{white-space:normal;overflow-wrap:anywhere}
.correction-counts th:first-child{width:27%}
.correction-counts thead th:nth-child(2){width:24%}
.correction-counts thead th:nth-child(3){width:20%}
@media(max-width:480px){.correction-counts th,.correction-counts td{padding:6px 4px}}
#toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:#fff;border:1px solid var(--b);border-left:4px solid var(--p);border-radius:10px;padding:10px 13px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--er)}.toast.warning{border-left-color:var(--a)}
.toast b{display:block;font-size:13px}.toast span{font-size:12px;color:var(--m)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:100%;max-width:400px}
.login .hero{background:var(--p);color:#fff;border-radius:16px 16px 0 0;padding:24px}
.login form{background:#fff;border:1px solid var(--b);border-top:0;border-radius:0 0 16px 16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:9px 12px;font-size:13px}
.drop{border:2px dashed #cbd5e1;border-radius:14px;padding:22px;text-align:center;position:relative;background:#f8fafc}.drop.on{border-color:var(--p);background:#eff6ff}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
pre.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;max-height:260px;font-size:11px}
#qr-reader{width:100%;min-height:200px;background:#0f172a;border-radius:12px;overflow:hidden}
.bottomnav{display:none}
@media(max-width:820px){
 nav.tabs{display:none}header.top{gap:10px;padding:0 12px}.userchip .who{display:none}
 .g2,.g3,.g4{grid-template-columns:1fr 1fr}main{padding:14px 12px 90px}
 .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);z-index:40}
 .bottomnav button{flex:1;border:0;background:none;padding:10px 2px;font:600 11px inherit;color:var(--m)}.bottomnav button.on{color:var(--p)}
}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.item{flex-direction:column;align-items:stretch}}
@media(max-width:820px){#toasts{bottom:78px;left:12px;right:12px;max-width:none}}
</style>
<script defer src="./assets/stockpulse.js?v=mobile-1"></script>
</head>
<body>
<div id="app">
  <div class="login"><div class="box">
    <div class="hero"><div class="small">STOCKPULSE · TOMA FÍSICA DE INVENTARIOS</div><h1>EL REY DE LOS LICORES</h1><div class="small">NIT 900.000.000-1</div></div>
    <div class="card col">
      <div><label for="boot-email">Correo electrónico</label><input id="boot-email" type="email" disabled></div>
      <div><label for="boot-pass">Contraseña</label><input id="boot-pass" type="password" disabled></div>
      <div role="status">Preparando el acceso… <a href="">Volver a cargar</a></div>
      <noscript><p>Active JavaScript en el navegador para usar StockPulse.</p></noscript>
    </div>
  </div></div>
</div><div id="modal"></div><div id="toasts"></div>

</body>
</html>
